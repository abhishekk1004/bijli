# Nginx site config for CTS CMS.
# Install to /etc/nginx/sites-available/cts and symlink into sites-enabled.
# Assumes gunicorn bound to unix:/run/cts/gunicorn.sock (see systemd unit)
# and the project checked out at /srv/cts.

upstream cts_app {
    server unix:/run/cts/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias /srv/cts/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/cts/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://cts_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
